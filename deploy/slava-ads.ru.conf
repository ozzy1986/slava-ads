<VirtualHost *:80>
    ServerName slava-ads.ru
    ServerAlias www.slava-ads.ru
    DocumentRoot /var/www/slava-ads.ru

    <Directory /var/www/slava-ads.ru>
        AllowOverride All
        Require all granted
    </Directory>

    # Protect secrets at server level too (defense in depth)
    <Files ".env">
        Require all denied
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/slava-ads_error.log
    CustomLog ${APACHE_LOG_DIR}/slava-ads_access.log combined
</VirtualHost>

# After DNS resolves to this server, enable HTTPS with:
#   sudo certbot --apache -d slava-ads.ru -d www.slava-ads.ru
# Certbot will create slava-ads.ru-le-ssl.conf and the HTTP->HTTPS redirect.
